#DATA
data_root: /data/groups/beets-tan/l.cai/cbim/cbim_model/meformer/acdc/acdc_3d_medformer
classes: 2
modality: mri


#MODEL
arch: swinunet
init_model: '/data/groups/beets-tan/l.cai/cbim/cbim_model/swin_tiny_patch4_window7_224.pth' #'/research/cbim/vast/yg397/github/UTNet/initmodel/swin_tiny_patch4_window7_224.pth'
base_chan: 48

#TRAIN
epochs: 1000
training_size: [224, 224]    # training crop size
start_epoch: 0
num_workers: 4 # modify this if I/O or augmentation is slow
aug_device: 'cpu'

split_seed: 12345 # random seed for train/test split (shuffle) before setting cross validation fold
k_fold: 5 # number of folds in cross validation


optimizer: adamw
base_lr: 0.0005
betas: [0.9, 0.999]
weight_decay: 0.05  # weight decay of SGD optimizer
weight: [0.1, 1] #, 1, 1]  # weitght of each class in the loss function
rlt: 1 # relation between CE and Dice loss

scale: 0.3  # scale for data augmentation
rotate: 180 # rotation angle for data augmentation
translate: 0
gaussian_noise_std: 0.02
additive_brightness_std: 0.7
gamma_range: [0.5, 1.6]

print_freq: 5

#VALIDATION
ema: True
ema_alpha: 0.99
val_freq: 10 # evaluate every val_freq epochs

#INFERENCE
sliding_window: False


# DDP
world_size: 1
proc_idx: 0
rank: 0
port: 10000
dist_url: 'tcp://localhost:10000' # make sure the port here is the same as in port
dist_backend: "nccl"
multiprocessing_distributed: true # if use PyTorch DDP for multi-gpu training
reproduce_seed: 2023 # use any seed you want, or use 'null' to disable deterministic behavior
